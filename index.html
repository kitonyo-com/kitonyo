<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I Love You ❤️</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  font-family: Georgia, serif;
  background:
    radial-gradient(circle at 50% 35%, #ffb6c8 0%, #f88da8 35%, #d94f76 100%);
}

.scene {
  position: relative;
  width: 360px;
  height: 420px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.envelope {
  position: relative;
  width: 300px;
  height: 190px;
  cursor: pointer;
  transition: transform 0.4s ease;
}

.envelope:hover {
  transform: scale(1.03);
}

/* Envelope body */
.envelope-body {
  position: absolute;
  inset: 0;
  background: #f9d7df;
  border-radius: 8px;
  box-shadow: 0 18px 45px rgba(100, 0, 35, 0.28);
  overflow: hidden;
}

/* bottom folds */
.envelope-body::before,
.envelope-body::after {
  content: "";
  position: absolute;
  bottom: 0;
  width: 0;
  height: 0;
}

.envelope-body::before {
  left: 0;
  border-left: 150px solid #f4bdca;
  border-top: 95px solid transparent;
}

.envelope-body::after {
  right: 0;
  border-right: 150px solid #f6c7d1;
  border-top: 95px solid transparent;
}

/* letter */
.letter {
  position: absolute;
  left: 22px;
  bottom: 16px;
  width: 256px;
  height: 165px;
  background: #fff9f6;
  border-radius: 8px;
  box-shadow: 0 8px 20px rgba(80, 0, 30, 0.14);
  z-index: 2;
  transition:
    transform 1.05s cubic-bezier(.2,.8,.2,1),
    height 1s ease;
  overflow: hidden;
}

.letter-content {
  height: 100%;
  padding: 28px 24px;
  text-align: center;
  opacity: 0;
  transform: translateY(22px);
  transition: 0.8s ease 0.45s;
}

.letter h1 {
  margin: 10px 0 8px;
  color: #c72f62;
  font-size: 34px;
  font-weight: normal;
}

.letter p {
  margin: 0;
  color: #7f4054;
  font-size: 17px;
  line-height: 1.5;
}

.heart {
  font-size: 42px;
  display: inline-block;
  animation: beat 1.2s infinite;
}

@keyframes beat {
  0%, 100% { transform: scale(1); }
  20% { transform: scale(1.16); }
  40% { transform: scale(1); }
  60% { transform: scale(1.12); }
  80% { transform: scale(1); }
}

/* envelope flap */
.flap {
  position: absolute;
  top: 0;
  left: 0;
  width: 0;
  height: 0;
  border-left: 150px solid transparent;
  border-right: 150px solid transparent;
  border-top: 105px solid #ed9fb1;
  transform-origin: top center;
  z-index: 5;
  transition: transform 0.9s cubic-bezier(.2,.8,.2,1);
}

/* seal */
.seal {
  position: absolute;
  left: 50%;
  top: 86px;
  transform: translate(-50%, -50%);
  width: 58px;
  height: 58px;
  background: #c92f5f;
  border-radius: 50%;
  z-index: 7;
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  font-size: 24px;
  box-shadow: 0 5px 12px rgba(120,0,40,.25);
  transition: 0.4s ease;
}

.hint {
  position: absolute;
  bottom: 35px;
  width: 100%;
  text-align: center;
  color: white;
  font-size: 16px;
  letter-spacing: 0.7px;
  opacity: 0.9;
  transition: opacity .5s;
}

/* opened state */
.scene.open .flap {
  transform: rotateX(180deg);
  z-index: 1;
}

.scene.open .letter {
  transform: translateY(-145px);
  height: 245px;
}

.scene.open .letter-content {
  opacity: 1;
  transform: translateY(0);
}

.scene.open .seal {
  opacity: 0;
  transform: translate(-50%, -50%) scale(0.3);
}

.scene.open .hint {
  opacity: 0;
}

/* floating hearts */
.floating-heart {
  position: fixed;
  bottom: -30px;
  color: rgba(255,255,255,.8);
  font-size: 22px;
  pointer-events: none;
  animation: floatUp linear forwards;
}

@keyframes floatUp {
  from {
    transform: translateY(0) scale(.8) rotate(0deg);
    opacity: 0;
  }
  10% { opacity: 1; }
  to {
    transform: translateY(-110vh) scale(1.5) rotate(25deg);
    opacity: 0;
  }
}
</style>
</head>

<body>

<div class="scene" id="scene">
  <div class="envelope" id="envelope">

    <div class="letter">
      <div class="letter-content">
        <div class="heart">❤️</div>
        <h1>I love you</h1>
        <p>
          More than words can say.<br>
          More with every day.<br>
          Always yours.
        </p>
      </div>
    </div>

    <div class="envelope-body"></div>

    <div class="flap"></div>

    <div class="seal">♥</div>
  </div>

  <div class="hint">Tap the letter ❤️</div>
</div>

<script>
const scene = document.getElementById("scene");
const envelope = document.getElementById("envelope");

let opened = false;

envelope.addEventListener("click", () => {
  opened = !opened;
  scene.classList.toggle("open", opened);

  if (opened) {
    createHearts();
  }
});

function createHearts() {
  for (let i = 0; i < 22; i++) {
    setTimeout(() => {
      const heart = document.createElement("div");
      heart.className = "floating-heart";
      heart.innerHTML = Math.random() > 0.5 ? "♥" : "♡";

      heart.style.left = Math.random() * 100 + "vw";
      heart.style.fontSize = (14 + Math.random() * 26) + "px";
      heart.style.animationDuration = (4 + Math.random() * 4) + "s";

      document.body.appendChild(heart);

      setTimeout(() => heart.remove(), 8000);
    }, i * 100);
  }
}
</script>

</body>
</html>
